# ==============================================================================
# AWTP-Lab Basic Site Settings
# ==============================================================================
locale                   : "en-US"
site_theme               : "default"
title                    : "AWTP-Lab"
title_separator          : "-"
name                     : "Youngjin Kim"
description              : "Advanced Water Treatment Plant Lab at Korea University"
url                      : "https://awtp-lab.github.io"
baseurl                  : ""
repository               : "AWTP-Lab/AWTP-Lab.github.io"

# ==============================================================================
# Site Author (사이드바 프로필 설정)
# ==============================================================================
author:
  avatar                 : "profile.png"
  name                   : "Youngjin Kim, Ph.D."
  bio                    : "Associate Professor<br>Dept. of Environmental Engineering"
  location               : "Sejong City, Korea"
  employer               : "Korea University"
  email                  : "kyuksh@korea.ac.kr"
  googlescholar          : "https://scholar.google.co.kr/citations?user=KTORn9IAAAAJ"
  orcid                  : "https://orcid.org/0000-0002-4101-4885"
  github                 : "AWTP-Lab"

# ==============================================================================
# Collections (기존 템플릿 로직 복구 - 에러 방지용)
# ==============================================================================
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# ==============================================================================
# Build & Plugins Settings
# ==============================================================================
timezone                 : "Asia/Seoul"
markdown                 : kramdown
highlighter              : rouge

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-redirect-from

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: true
